<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lux-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1A1829" />
      <stop offset="100%" stop-color="#0B0B13" />
    </radialGradient>
    <linearGradient id="lux-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1D6" />
      <stop offset="50%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#lux-bg)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="200" cy="200" r="110" fill="none" stroke="rgba(224,169,109,0.2)" stroke-width="1" />
  
  <!-- Luxury Perfume Flask Silhouette -->
  <g transform="translate(130, 110)" filter="url(#glow)">
    <!-- Stopper -->
    <rect x="55" y="10" width="30" height="20" rx="4" fill="url(#lux-gold)" opacity="0.9" />
    <rect x="62" y="30" width="16" height="15" fill="url(#lux-gold)" opacity="0.75" />
    <!-- Shoulder & Bottle -->
    <path d="M 30 55 C 30 45, 110 45, 110 55 L 120 140 C 120 155, 20 155, 20 140 Z" fill="rgba(255,255,255,0.06)" stroke="url(#lux-gold)" stroke-width="2" />
    <!-- Inner Core Liquid -->
    <path d="M 34 85 C 45 80, 95 80, 106 85 L 114 135 C 114 148, 26 148, 26 135 Z" fill="rgba(224,169,109,0.18)" />
    <!-- Emblem Label -->
    <rect x="42" y="90" width="56" height="32" rx="4" fill="#0B0B13" stroke="rgba(224,169,109,0.6)" stroke-width="1" />
    <text x="70" y="106" font-family="'Cormorant Garamond', Georgia, serif" font-size="10" fill="#E0A96D" font-weight="bold" text-anchor="middle" letter-spacing="2">VELVET</text>
    <text x="70" y="117" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#FFF1D6" text-anchor="middle" letter-spacing="1">AURA</text>
  </g>
  
  <text x="200" y="310" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="3">AUTHENTIC IMPORT</text>
</svg>
